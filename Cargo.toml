[workspace]
members = [
    ".",
    "crates/ramo-core",
    "crates/ramo-github",
    "crates/ramo-mobile",
    "crates/ramo-server",
    "crates/uniffi-bindgen",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"

# Profiles are only honored at the workspace root, so these apply to every
# member crate. Full debuginfo put the largest artifacts at 140-174 MB each,
# and Cargo never evicts old hash-variants: target/debug had reached 75 GB
# across ~27 generations of every test binary.
[profile.dev]
debug = 1

[profile.test]
debug = "line-tables-only"

[package]
name = "ramo"
version = "0.1.0"
edition = "2024"

[lib]
name = "ramo"
path = "src/lib.rs"

[dependencies]
ramo-core = { path = "crates/ramo-core" }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["use-dev-tty"] }
clap = { version = "4", features = ["derive"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.23"
similar = { version = "3", features = ["unicode"] }
shell-words = "1"
unicode-width = "0.2"
notify = "8"
globset = "0.4"
margem = { git = "https://github.com/carlosarraes/margem", rev = "47c100e4be071e5773de91b0226c86defde60c69", version = "0.0.2" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
portable-pty = "0.9"
predicates = "3"
tempfile = "3"
vt100 = "0.15"

[[bench]]
name = "parity"
harness = false
