[package]
name = "ramo-github"
version = "0.0.15"
edition.workspace = true
rust-version.workspace = true

[dependencies]
ramo-core = { path = "../ramo-core" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
zeroize = "1.9.0"

[dev-dependencies]
httpmock = "0.8.3"
