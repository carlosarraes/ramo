name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Portable Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable
        with:
          toolchain: stable
      - name: Test portable Rust on Linux
        if: runner.os == 'Linux'
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Test portable Rust serially on macOS and Windows
        if: runner.os != 'Linux'
        run: cargo test --locked --workspace --all-targets --all-features -- --test-threads=1
      - name: PowerShell installer selection
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -DryRun -Architecture x64 -Version v0.0.6
          .\install.ps1 -DryRun -Architecture arm64 -Version v0.0.6
      - name: Unix installer selection
        if: runner.os != 'Windows'
        shell: bash
        run: |
          RAMO_INSTALL_DRY_RUN=1 RAMO_INSTALL_OS=linux RAMO_INSTALL_ARCH=x86_64 ./install.sh v0.0.6
          RAMO_INSTALL_DRY_RUN=1 RAMO_INSTALL_OS=darwin RAMO_INSTALL_ARCH=arm64 ./install.sh v0.0.6

  unix-pty:
    name: Native PTY (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable
        with:
          toolchain: stable
      - name: Test native PTY behavior
        if: runner.os != 'macOS'
        run: >-
          cargo test --locked -p ramo
          --test pty_notes
          --test pty_pager
          --test pty_session
          --test pty_ui
          --test pty_watch
          --test session_e2e
          --test session_registration
          --test terminal_appearance
      - name: Test native PTY behavior serially on macOS
        if: runner.os == 'macOS'
        run: >-
          cargo test --locked -p ramo
          --test pty_notes
          --test pty_pager
          --test pty_session
          --test pty_ui
          --test pty_watch
          --test session_e2e
          --test session_registration
          --test terminal_appearance
          -- --test-threads=1

  lint:
    name: Rust format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Check ARM64 Linux portability
        run: cargo check --locked -p ramo -p ramo-server --target aarch64-unknown-linux-gnu

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@7a445ee88d4e23b52c33e64c2b48b79a7c2a9d31 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1a # v3.2.2
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Install pinned Android SDK packages
        run: >-
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
          "platform-tools"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Configure local Android SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
      - name: Test Rust workspace
        run: cargo test --locked --workspace
      - name: Test, lint, and assemble Android
        working-directory: android
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ramo-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
